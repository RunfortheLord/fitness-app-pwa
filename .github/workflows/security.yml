name: Scheduled security checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '31 8 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Secrets, dependencies, and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan repository and production dependencies
        run: npm run security:check

      - name: Run security-focused static analysis
        run: npm run lint
